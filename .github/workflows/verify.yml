name: Verify public toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Evaluator self-tests
        run: python bin/eval-runner.py self-test
      - name: Task linter self-tests
        run: python bin/golden-lint.py --self-test
      - name: Public CLI contracts
        run: python -m unittest discover -s tests -v
      - name: Lint synthetic tasks
        run: |
          python bin/golden-lint.py examples/review-contract/tasks
          python bin/golden-lint.py examples/judge/tasks
